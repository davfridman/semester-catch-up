<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Semester Catch-Up</title>
<meta name="description" content="Your HUJI semester: what's due, what's on each day, and what to watch.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semester">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: an iPhone app. Bottom tab bar (Week, Semester, Courses, More), large titles, inset-grouped lists, bottom sheets with a grabber.
   Color has one job: the state of an item. Every item is a tile with a border in its state color and a fill of the same color at low opacity.
   Courses carry no color at all; they are named in text. Controls are monochrome. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.35); --sep:rgba(60,60,67,.18);
  --bar:rgba(249,249,251,.86); --scrim:rgba(0,0,0,.32); --shadow:0 12px 32px rgba(0,0,0,.18);
  --s-open:#8E8E93; --s-soon:#FF9500; --s-later:#5856D6; --s-done:#34C759; --s-skip:#AEAEB2; --s-closed:#FF3B30;
  --tint-a:12%; --tint-b:22%;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --bar:rgba(22,22,24,.86); --scrim:rgba(0,0,0,.55); --shadow:0 12px 32px rgba(0,0,0,.6);
  --s-open:#98989F; --s-soon:#FF9F0A; --s-later:#7D7AFF; --s-done:#30D158; --s-skip:#636366; --s-closed:#FF453A;
  --tint-a:16%; --tint-b:28%;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --bar:rgba(22,22,24,.86); --scrim:rgba(0,0,0,.55); --shadow:0 12px 32px rgba(0,0,0,.6);
  --s-open:#98989F; --s-soon:#FF9F0A; --s-later:#7D7AFF; --s-done:#30D158; --s-skip:#636366; --s-closed:#FF453A;
  --tint-a:16%; --tint-b:28%;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.rank{font-size:.78rem;font-weight:700;color:var(--label2);min-width:16px;font-variant-numeric:tabular-nums}
.imp{display:inline-flex;gap:2px;vertical-align:-1px}
.imp i{width:4px;height:11px;border-radius:2px;background:var(--fill2)}
.imp i.on{background:var(--label)}
.why{color:var(--label2)}
.auth{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:calc(40px + env(safe-area-inset-top,0px))}
.auth .logo{width:72px;height:72px;border-radius:18px;align-self:flex-start}
.auth .err{color:var(--s-closed);font-size:.9rem;margin:0}
.auth .ok{color:var(--s-done);font-size:.9rem;margin:0}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--s-done);margin-right:6px;vertical-align:1px}
.syncdot.saving{background:var(--s-later)}.syncdot.offline{background:var(--s-soon)}
.topic{font-weight:400;color:var(--label2)}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--label);font:16px/1.35 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--label);outline-offset:2px}
.s-open{--sc:var(--s-open)}.s-soon{--sc:var(--s-soon)}.s-later{--sc:var(--s-later)}.s-done{--sc:var(--s-done)}.s-skip{--sc:var(--s-skip)}.s-closed{--sc:var(--s-closed)}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{max-width:760px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.app.wide{max-width:1480px}
.navbar{position:sticky;top:0;padding-top:calc(8px + env(safe-area-inset-top,0px))!important;z-index:5;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;min-height:44px;background:var(--bar);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:.5px solid var(--sep)}
.navbar .mid{flex:1;text-align:center;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn{appearance:none;border:0;background:none;color:var(--label);font-size:1.02rem;cursor:pointer;padding:6px 4px;display:inline-flex;align-items:center;gap:2px;min-width:44px;min-height:36px}
.navbtn.r{justify-content:flex-end}
.navbtn svg{width:20px;height:20px}
.navbtn:disabled{opacity:.3}
.large{padding:10px 0 4px}
.large h1{font:700 2.1rem/1.1 var(--font-d);letter-spacing:.01em;margin:0}
.large p{margin:4px 0 0;color:var(--label2);font-size:.95rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;background:var(--bar);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-top:.5px solid var(--sep);padding:5px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar-in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
.tabbar button{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.64rem;font-weight:500;color:var(--label3);cursor:pointer;padding:3px 0;min-height:46px;position:relative}
.tabbar button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--label)}
.tabbar button[aria-current="page"] svg{stroke-width:2.1}
.tbadge{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--s-closed);color:#fff;font-size:.66rem;font-weight:600;display:grid;place-items:center;padding:0 4px}

/* iOS controls */
.segc{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin:12px 0}
.segc button{appearance:none;border:0;background:none;flex:1;padding:6px 8px;border-radius:7px;font-size:.84rem;font-weight:500;cursor:pointer;color:var(--label);min-height:30px}
.segc button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 4px 8px;font-size:.8rem;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.sechead b{font-weight:600;color:var(--label);text-transform:none;letter-spacing:0;font-size:1.12rem}
.sechead .act{appearance:none;border:0;background:none;color:var(--label2);font-size:.86rem;text-transform:none;cursor:pointer;padding:0}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.cellr{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;border-top:.5px solid var(--sep);width:100%;appearance:none;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;cursor:pointer;color:inherit;font-size:1rem}
.group>.cellr:first-child{border-top:0}
.cellr .grow{flex:1;min-width:0}
.cellr .grow small{display:block;color:var(--label2);font-size:.82rem;margin-top:1px}
.cellr .val{color:var(--label2);font-size:.92rem;white-space:nowrap}
.chev{color:var(--label3);font-size:1.2rem;line-height:1}
.foot{color:var(--label2);font-size:.8rem;margin:8px 16px 0}
.btn{appearance:none;border:0;background:var(--fill);color:var(--label);border-radius:10px;padding:9px 14px;font-weight:600;font-size:.92rem;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn-fill{background:var(--label);color:var(--bg)}
.btn-danger{color:var(--s-closed)}

/* tiles: border in state color, fill in the same color at low opacity */
.tiles{display:flex;flex-direction:column;gap:8px}
.tile{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr) auto 24px;align-items:center;gap:10px;padding:10px 6px 10px 12px;border:1.5px solid var(--sc);border-radius:14px;background:color-mix(in srgb,var(--sc) var(--tint-a),var(--card));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.tile.s-open{border-color:color-mix(in srgb,var(--sc) 55%,transparent);background:var(--card)}
.tick{appearance:none;width:24px;height:24px;border-radius:50%;border:1.8px solid var(--sc);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;color:transparent}
.tick:hover{color:var(--sc)}
.s-done .tick{background:var(--sc);color:#fff}
.s-skip .tick{border-style:dashed;color:var(--sc)}
.tick svg{width:13px;height:13px}
.tbody{appearance:none;border:0;background:none;padding:0;text-align:left;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:2px;color:inherit}
.tbody b{font-weight:600;font-size:.98rem;line-height:1.25;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px}
.tbody small{color:var(--label2);font-size:.8rem;display:flex;flex-wrap:wrap;gap:0 6px}
.tbody small>span:not(:last-child)::after{content:"·";margin-left:6px}
.s-done .tbody b{color:var(--label2)}
.s-skip .tbody b{color:var(--label3);text-decoration:line-through}
.tstate{font-size:.78rem;font-weight:600;color:var(--sc);white-space:nowrap;text-align:right}
.s-open .tstate{color:var(--label2);font-weight:500}
.grip{display:grid;place-items:center;width:24px;height:36px;color:var(--label3);cursor:grab;touch-action:none}
.grip svg{width:18px;height:18px}
.ctag{font:600 .66rem var(--mono);letter-spacing:.04em;color:var(--label2);background:var(--fill);border-radius:5px;padding:1px 5px;flex:none}
@media (max-width:420px){.tile{grid-template-columns:26px minmax(0,1fr) 24px}.tile .tstate{grid-column:2;grid-row:2;text-align:left;margin-top:-4px}.tile .grip{grid-row:1 / span 2;grid-column:3}.tile .tick{grid-row:1 / span 2}}

/* week planner */
.weekbar{display:flex;align-items:center;gap:6px;justify-content:space-between}
.day{margin-top:18px}
.day-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 8px}
.day-h b{font-size:1.02rem;font-weight:600}
.day-h span{font-size:.82rem;color:var(--label2)}
.day-h .today{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--label);border-radius:5px;padding:1px 6px}
.day-h .fixed{margin-left:auto;font-size:.76rem;color:var(--label2)}
.zone{min-height:48px;border-radius:14px;display:flex;flex-direction:column;gap:8px}
.zone:empty::before,.zone.emptyz::before{content:attr(data-hint);display:grid;place-items:center;min-height:46px;border:1.5px dashed var(--sep);border-radius:14px;color:var(--label3);font-size:.84rem}
.dragging .zone{outline:1.5px dashed var(--label3);outline-offset:3px}
.zone.over,.cell.over{outline:2px solid var(--label)!important;outline-offset:3px;background:var(--fill)}
.tile.nogrip{grid-template-columns:26px minmax(0,1fr) auto;padding-right:12px}
@media (max-width:420px){.tile.nogrip{grid-template-columns:26px minmax(0,1fr)}}
.nothing{margin:0 4px;color:var(--label3);font-size:.86rem;padding:6px 0}
.pastday .tiles,.pastday .nothing{opacity:.7}
.todayday .day-h b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.weeksum{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.weeksum span{background:var(--card);border-radius:10px;padding:7px 11px;font-size:.84rem;color:var(--label2)}
.weeksum b{color:var(--label);font-weight:700;margin-right:2px}
.weeksum .s-soon b{color:var(--sc)}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--label);text-decoration:underline;cursor:pointer;font-size:inherit}
.picker{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--bar);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-top:.5px solid var(--sep);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.picker-in{display:flex;gap:8px;overflow-x:auto;max-width:760px;margin:0 auto;scrollbar-width:none}
.picker-in::-webkit-scrollbar{display:none}
.stats .stat{appearance:none;flex:none;display:inline-flex;align-items:baseline;gap:5px;border:1.5px solid var(--sc);background:color-mix(in srgb,var(--sc) var(--tint-a),var(--card));color:var(--label);border-radius:10px;padding:6px 11px;font-size:.84rem;font-weight:500;cursor:pointer;white-space:nowrap;min-height:34px}
.stats .stat.s-open{border-color:color-mix(in srgb,var(--sc) 55%,transparent);background:var(--card)}
.stats .stat b{font-weight:700;color:var(--sc)}
.stats .stat.s-open b{color:var(--label)}
.cpick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:-4px -2px 6px;padding:2px}
.cpick::-webkit-scrollbar{display:none}
.cpick button{flex:none;appearance:none;border:.5px solid var(--sep);background:var(--card);color:var(--label);border-radius:18px;padding:6px 12px 6px 8px;font-size:.88rem;font-weight:500;display:inline-flex;gap:7px;align-items:center;cursor:pointer;white-space:nowrap;min-height:36px}
.cpick button[aria-pressed="true"]{background:var(--label);color:var(--bg);border-color:var(--label)}
.cpick button[aria-pressed="true"] .ctag{background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg)}
/* swipe rows */
.swipe{position:relative;border-radius:14px;overflow:hidden}
.swipe>.tile{transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:1}
.swipe.swiping>.tile{transition:none}
.sw-l,.sw-r{position:absolute;inset:0;display:flex;align-items:center;border-radius:14px;visibility:hidden}
.sw-l{background:var(--s-done);color:#fff;padding-left:20px;gap:8px;font-weight:700;font-size:.9rem}
.sw-l svg{width:18px;height:18px}
.swipe.commit .sw-l{filter:brightness(1.08)}
.sw-r{justify-content:flex-end;background:var(--card2)}
.sw-r button{appearance:none;border:0;height:100%;width:82px;font-weight:600;font-size:.84rem;cursor:pointer;color:#fff}
.sw-r button:first-child{background:var(--s-skip)}
.sw-r button:last-child{background:var(--label2);color:var(--bg)}
.swipe.show-l .sw-l,.swipe.show-r .sw-r,.swipe.open-r .sw-r{visibility:visible}
/* course: week-by-week progress */
.prog{background:var(--card);border-radius:14px;padding:4px 0}
.prow{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;align-items:end;padding:8px 12px;border-top:.5px solid var(--sep)}
.prow:first-child{border-top:0}
.prow.past{opacity:.72}
.prow.now{background:color-mix(in srgb,var(--label) 5%,transparent)}
.prow-h{appearance:none;border:0;background:none;text-align:left;padding:0;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:1px;align-self:center}
.prow-h b{font-size:.88rem;font-weight:700;display:flex;gap:5px;align-items:center}
.prow-h span{font-size:.72rem;color:var(--label2)}
.prow-h em{font-style:normal;font-size:.72rem;color:var(--label2);font-variant-numeric:tabular-nums}
.pbar{display:grid;gap:4px}
.pseg{appearance:none;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;color:inherit}
.pl{font-size:.7rem;font-weight:600;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pb{display:grid;place-items:center;height:30px;border-radius:8px;border:1.5px solid var(--sc);background:color-mix(in srgb,var(--sc) var(--tint-b),var(--card));color:var(--sc)}
.pb svg{width:16px;height:16px}
.pseg.s-open .pb{color:var(--label2)}
.pseg.s-open .pb{background:var(--card);border-color:color-mix(in srgb,var(--sc) 60%,transparent)}
.pseg.s-skip .pb{border-style:dashed}
.pseg:hover .pb{filter:brightness(.97)}
.pseg:focus-visible{outline:none}.pseg:focus-visible .pb{outline:2px solid var(--label);outline-offset:2px}
.pnone{font-size:.8rem;color:var(--label3);align-self:center}
.key.s-later b{color:var(--sc)}
@media (prefers-reduced-motion:no-preference){.from-r{animation:fromr .26s cubic-bezier(.2,.8,.2,1)}.from-l{animation:froml .26s cubic-bezier(.2,.8,.2,1)}@keyframes fromr{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}@keyframes froml{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}}
.picker button{flex:none;appearance:none;border:.5px solid var(--sep);background:var(--card);color:var(--label);border-radius:18px;padding:6px 12px 6px 8px;font-size:.88rem;font-weight:500;display:inline-flex;gap:7px;align-items:center;cursor:pointer;white-space:nowrap;min-height:36px}
.picker button[aria-pressed="true"]{background:var(--label);color:var(--bg);border-color:var(--label)}
.picker button[aria-pressed="true"] .ctag{background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg)}
body.haspicker .app{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.haspicker .legend{margin-bottom:4px}
body.haspicker .toast{bottom:calc(128px + env(safe-area-inset-bottom,0px))}

/* semester sheet */
.sheet-wrap{overflow:auto;max-height:calc(100dvh - 210px);border-radius:12px;background:var(--card);border:.5px solid var(--sep);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
table.sheet{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:.84rem}
.sheet th,.sheet td{border-right:.5px solid var(--sep);border-bottom:.5px solid var(--sep);vertical-align:top;background:var(--card)}
.sheet thead th{position:sticky;top:0;z-index:2;background:var(--card2);text-align:left;font-weight:600;padding:9px 10px;white-space:nowrap}
.sheet thead th small{display:block;font-weight:400;color:var(--label2);font-size:.74rem}
.sheet thead th.corner{left:0;z-index:3}
.sheet tbody th{position:sticky;left:0;z-index:1;background:var(--card2);text-align:left;font-weight:400;padding:0}
.wk{appearance:none;border:0;background:none;width:100%;text-align:left;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;color:inherit}
.wk b{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:6px}
.wk span{font-size:.72rem;color:var(--label2);white-space:nowrap}
.nowtag{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--label);border-radius:4px;padding:1px 5px}
.sheet td{padding:6px;min-width:150px;max-width:220px}
tr.past td,tr.past th{opacity:.55}
tr.now td,tr.now th{background:color-mix(in srgb,var(--label) 4%,var(--card))}
.cell{display:flex;flex-wrap:wrap;gap:5px;min-height:30px;border-radius:8px;align-content:flex-start}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

const ic = t => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[t] || ICON.Reading}</svg>`;
const safeUrl = u => { try { const x = new URL(String(u || '').trim()); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } };
const uid = () => Math.random().toString(36).slice(2, 9);
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- sample data ---------- */
function sample() {
  const items = [], s0 = parse(SEM.start), today = new Date();
  const push = (c, type, n, date, x = {}) => items.push({ id: uid(), c, type, n, title: x.title || `${type} ${n}`, date: iso(date), time: x.time || '', opens: x.opens || '', weight: x.weight ?? null, status: x.status || 'todo', link: '', note: x.note || '', plan: '' });

  for (let n = 1; n <= 6; n++) ex('c1', n, n * 2 - 2, 4, n * 2 - 1, 4, 1.7);
  for (let n = 1; n <= 5; n++) ex('c2', n, n * 2 - 1, 4, n * 2 + 1, 4, 4);
  for (let n = 1; n <= 4; n++) ex('c4', n, n * 3 - 3, 0, n * 3 - 1, 0, 12);
  for (let n = 1; n <= 5; n++) ex('c3', n, n * 2, 3, n * 2 + 1, 3, 3, { type: 'Lab', title: `Lab ${n} report` });

  push('c1', 'Exam', 2, addDays(s0, 10 * 7 + 5), { time: '09:00', weight: 10, title: 'Midterm quiz 2' });

let data, ui = { cview: 'weeks', tab: 'home', mode: 'day', sel: null, density: 'compact', course: null };
const CFG = window.APP_CONFIG || {};
const CLOUD = !!(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase);

const syncLabel = () => `<span class="syncdot ${sync === 'saving' ? 'saving' : sync === 'offline' ? 'offline' : ''}"></span>${sync === 'saving' ? 'Saving…' : sync === 'offline' ? 'Offline. Changes will sync when you’re back online.' : 'Synced with your iPhone and Mac'}`;

let weeks = [];

buildWeeks();
const weekOf = ds => weeks.find(w => ds >= w.ws && ds <= w.we);
const C = id => data.courses.find(c => c.id === id) || { name: '?', short: '?' };

  if (it.status === 'skip') return { k: 'skip', t: 'Won’t do' };

    if (it.date > today) return { k: 'later', t: wd(it.date) };

/* ---------- pieces ---------- */
function tile(it, o = {}) {
  const s = o.opening ? { k: 'later', t: 'Opens' + (it.opensTime ? ' ' + it.opensTime : '') } : state(it), c = C(it.c);

  const sub = [];

    sub.push(`<span>${esc(it.type)}</span>`, `<span>${WATCH.has(it.type) ? esc(dDay(it.date)) : 'due ' + esc(dDay(it.date)) + (it.time ? ' ' + esc(it.time) : '')}</span>`);

const gate = it => /required|gate/i.test(it.note || '');
function importance(it) {
  const w = it.weight;
  if (it.type === 'Exam' || gate(it) || (w != null && w >= 10)) return 3;
  if ((w != null && w >= 3) || it.type === 'Project') return 2;

function weekStats(sel, f) {
  const today = iso(new Date()), cur = curWeek();
  const inW = data.items.filter(it => f(it) && it.date >= sel.ws && it.date <= sel.we);
  const watch = inW.filter(it => WATCH.has(it.type) && it.date <= today && it.status === 'todo');
  const dues = inW.filter(it => !WATCH.has(it.type) && it.status === 'todo' && state(it).k !== 'closed' && state(it).k !== 'later');
  const opening = data.items.filter(it => f(it) && it.opens && it.opens >= sel.ws && it.opens <= sel.we && state(it).k === 'later').length + inW.filter(it => state(it).k === 'later' && !WATCH.has(it.type)).length;
  const done = inW.filter(it => it.status === 'done').length;
  const closed = inW.filter(it => state(it).k === 'closed').length;
  const carry = sel === cur ? data.items.filter(it => f(it) && it.date < sel.ws && openish(it)).length : 0;
  return [
    [watch.length, 'to watch', watch.some(it => state(it).k === 'soon') ? 'soon' : 'open', 'watch'],
    [dues.length, 'due', dues.some(it => state(it).k === 'soon') ? 'soon' : 'open', 'due'],
    [opening, 'opening', 'later', 'opening'],
    [done, 'done', 'done', 'done'],
    [closed, 'closed', 'closed', 'closed'],
    [carry, 'from earlier', 'soon', 'carry'],
  ].filter(([n, , , k]) => n || ['watch', 'due', 'done'].includes(k));
}

/* ---------- sheets ---------- */
const dlg = $('dlg'), form = $('form');
const show = html => { form.innerHTML = '<div class="grabber" aria-hidden="true"></div>' + html; if (!dlg.open) dlg.showModal ? dlg.showModal() : dlg.setAttribute('open', ''); };
const close = () => { if (dlg.open) dlg.close(); };
dlg.addEventListener('click', e => { if (e.target === dlg) close(); });
function detail(id) {
  const it = byId(id); if (!it) return;
  const c = C(it.c), s = state(it), link = safeUrl(it.link), w = weekOf(it.date);
  const opts = WATCH.has(it.type) ? [['todo', 'To watch', 'open'], ['done', 'Watched', 'done'], ['skip', 'Skip', 'skip']] : [['todo', 'To do', 'open'], ['done', 'Done', 'done'], ['skip', 'Won’t do', 'skip']];
  show(`<div class="sheet-top"><div class="t"><h3 dir="auto">${esc(it.title)}</h3><p>${esc(c.name)} · ${esc(it.type)}${w ? ' · week ' + w.n : ''}</p></div><button type="button" class="x" data-action="close" aria-label="Close">✕</button></div>
    <div class="tile s-${s.k}" style="grid-template-columns:1fr;padding:12px 14px"><span style="font-weight:600;color:var(--sc)">${esc(s.t)}</span></div>
    <div class="stateseg">${opts.map(([v, l, k]) => `<button type="button" class="s-${k}" data-action="status" data-id="${it.id}" data-v="${v}" aria-pressed="${(it.status || 'todo') === v}">${l}</button>`).join('')}</div>
    <div class="formg">
      ${it.opens ? `<label><span>Opens</span><input value="${esc(dDay(it.opens))}" readonly></label>` : ''}
      <label><span>${WATCH.has(it.type) ? 'Held' : 'Due'}</span><input value="${esc(dDay(it.date))}${it.time ? ' ' + esc(it.time) : ''}" readonly></label>
      ${it.weight ? `<label><span>Worth</span><input value="${it.weight}% of grade" readonly></label>` : ''}
      <label><span>Do on</span><input type="date" id="f-plan" value="${esc(it.plan || '')}" data-change="plan" data-id="${it.id}"></label>
    </div>
    ${it.note ? `<p class="foot" style="margin:0 4px" dir="auto">${esc(it.note)}</p>` : ''}
    <div style="display:flex;gap:8px">${link ? `<a class="btn btn-fill" style="flex:1" href="${esc(link)}" target="_blank" rel="noopener">Open link ↗</a>` : ''}<button type="button" class="btn" style="flex:1" data-action="edit" data-id="${it.id}">Edit</button></div>`);
}
function editor(it, isNew) {
  show(`<div class="sheet-top"><button type="button" class="navbtn" data-action="close">Cancel</button><div class="t" style="text-align:center"><h3 style="font-size:1rem">${isNew ? 'New item' : 'Edit'}</h3></div><button type="submit" class="navbtn r" style="font-weight:600">${isNew ? 'Add' : 'Done'}</button></div>
    <div class="formg">
      <label><span>Course</span><select id="f-c">${data.courses.map(c => `<option value="${c.id}" ${c.id === it.c ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label><span>Type</span><select id="f-type">${TYPES.map(t => `<option ${t === it.type ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label><span>Title</span><input id="f-title" dir="auto" value="${esc(it.title)}" placeholder="Exercise 4" autocomplete="off"></label>
    </div>
    <div class="formg">
      <label><span>Opens</span><input type="date" id="f-opens" value="${esc(it.opens)}"></label>
      <label><span>Date / due</span><input type="date" id="f-date" value="${esc(it.date)}"></label>
      <label><span>Time</span><input type="time" id="f-time" value="${esc(it.time)}"></label>
      <label><span>Worth %</span><input type="number" id="f-weight" min="0" max="100" step="0.5" value="${it.weight ?? ''}" placeholder="optional"></label>
    </div>
    <div class="formg">
      <label><span>Link</span><input type="url" id="f-link" value="${esc(it.link)}" placeholder="https://" autocomplete="off"></label>
      <label style="align-items:flex-start"><span style="padding-top:6px">Note</span><textarea id="f-note" dir="auto" rows="2">${esc(it.note)}</textarea></label>
    </div>
    ${isNew ? '' : `<button type="button" class="btn btn-danger" data-action="del" data-id="${it.id}">Delete item</button>`}`);
  form.dataset.new = isNew ? JSON.stringify(it) : ''; form.dataset.id = it.id;
}
form.addEventListener('submit', e => {
  e.preventDefault();
  const v = id => ($(id) || {}).value || '';
  const base = form.dataset.new ? JSON.parse(form.dataset.new) : byId(form.dataset.id);
  if (!base || !v('f-title').trim() || !/^\d{4}-\d{2}-\d{2}$/.test(v('f-date'))) { toast('Add a title and a date.'); return; }
  const next = { ...base, c: v('f-c'), type: v('f-type'), title: v('f-title').trim(), date: v('f-date'), time: v('f-time'), opens: v('f-opens'), weight: v('f-weight') === '' ? null : +v('f-weight'), link: v('f-link').trim(), note: v('f-note').trim() };
  if (form.dataset.new) { next.n = data.items.filter(x => x.c === next.c && x.type === next.type).length + 1; data.items.push(next); } else Object.assign(base, next);
  save(); close(); render(); toast(form.dataset.new ? 'Added' : 'Saved');
});
document.addEventListener('change', e => {
  if (e.target.dataset.change === 'plan') { const it = byId(e.target.dataset.id); if (!it) return; it.plan = e.target.value; save(); render(); toast(it.plan ? `Planned for ${dDay(it.plan)}` : 'Removed from the plan'); }
});

/* ---------- toast with undo ---------- */
let toastT, undoFn = null;
function toast(msg, undo) {
  const t = $('toast'); undoFn = undo || null;
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" data-action="undo">Undo</button>' : ''}`;
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; undoFn = null; }, undo ? 5000 : 2400);
}

/* ---------- drag and drop (mouse, pen and touch) ---------- */
let pend = null, drag = null, suppressClick = false;
const dropAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('[data-drop]'); };
function begin(p) {
  const it = byId(p.id); if (!it) return;
  const r = p.el.getBoundingClientRect();
  const g = p.el.cloneNode(true); g.classList.add('ghostdrag'); g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
  document.body.appendChild(g); p.el.classList.add('lifted'); document.body.classList.add('dragging');
  drag = { ...p, it, g, dx: p.x - r.left, dy: p.y - r.top, over: null };
  if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
}
function move(x, y) {
  drag.g.style.left = (x - drag.dx) + 'px'; drag.g.style.top = (y - drag.dy) + 'px';
  const z = dropAt(x, y);
  if (z !== drag.over) { drag.over && drag.over.classList.remove('over'); drag.over = z; z && z.classList.add('over'); }
  const wrap = $('wrap');
  if (wrap) { const r = wrap.getBoundingClientRect(); if (y < r.top + 40) wrap.scrollTop -= 12; else if (y > r.bottom - 40) wrap.scrollTop += 12; if (x < r.left + 40) wrap.scrollLeft -= 12; else if (x > r.right - 40) wrap.scrollLeft += 12; }
  if (y < 70) window.scrollBy(0, -12); else if (y > innerHeight - 110) window.scrollBy(0, 12);
}
function finish(x, y) {
  const { it, g, el } = drag; const z = dropAt(x, y);
  g.remove(); el.classList.remove('lifted'); document.body.classList.remove('dragging'); drag.over && drag.over.classList.remove('over');
  drag = null; suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  if (!z) return;
  const before = { ...it }, undo = () => { Object.assign(it, before); save(); render(); };
  const [kind, a, b] = z.dataset.drop.split(':');
  if (kind === 'day') { if (it.plan === a) return; it.plan = a; it.order = Date.now(); save(); render(); toast(`${it.title} → ${dDay(a)}`, undo); }
  else if (kind === 'tray') { if (!it.plan) return; it.plan = ''; save(); render(); toast(`${it.title} unscheduled`, undo); }
  else if (kind === 'cell') {
    if (a !== it.c) { toast('Items stay in their own course column.'); return; }
    const from = weekOf(it.date); const shift = (+b - (from ? from.n : +b)) * 7; if (!shift) return;
    it.date = iso(addDays(parse(it.date), shift)); if (it.opens) it.opens = iso(addDays(parse(it.opens), shift)); if (it.plan) it.plan = '';
    const wrap = $('wrap'); const keep = wrap ? [wrap.scrollTop, wrap.scrollLeft] : null;
    save(); render(); const w2 = $('wrap'); if (w2 && keep) { w2.dataset.kept = 1; w2.scrollTop = keep[0]; w2.scrollLeft = keep[1]; }
    toast(`${it.title} moved to week ${b}`, () => { undo(); });
  }
}
document.addEventListener('pointerdown', e => {
  if (e.button !== 0 || dlg.open) return;
  const el = e.target.closest('[data-drag]'); if (!el) return;
  const onGrip = !!e.target.closest('[data-grip]');
  pend = { el, id: el.dataset.drag, x: e.clientX, y: e.clientY, touch: e.pointerType !== 'mouse', pid: e.pointerId };
  if (onGrip) { e.preventDefault(); begin(pend); pend = null; return; }
  if (pend.touch) pend.timer = setTimeout(() => { if (pend) { begin(pend); pend = null; } }, 380);
});
document.addEventListener('pointermove', e => {
  if (drag) { e.preventDefault(); move(e.clientX, e.clientY); return; }
  if (!pend) return;
  const d = Math.hypot(e.clientX - pend.x, e.clientY - pend.y);
  if (pend.touch) { if (d > 9) { clearTimeout(pend.timer); pend = null; } }
  else if (d > 6) { begin(pend); pend = null; move(e.clientX, e.clientY); }
});
const end = e => { if (pend) { clearTimeout(pend.timer); pend = null; } if (drag && !(drag.touch && e.pointerType !== 'mouse' && lastT)) finish(e.clientX, e.clientY); };
document.addEventListener('pointerup', end);
document.addEventListener('pointercancel', () => { if (pend) { clearTimeout(pend.timer); pend = null; } if (drag && !drag.touch) finish(-1, -1); });
// on touch the browser may cancel pointer events once a finger moves, so touch events carry the drag from there
let lastT = null;
document.addEventListener('touchmove', e => { if (!drag) return; e.preventDefault(); const t = e.touches[0]; lastT = [t.clientX, t.clientY]; move(t.clientX, t.clientY); }, { passive: false });
document.addEventListener('touchend', () => { if (drag && drag.touch) finish(...(lastT || [-1, -1])); lastT = null; });
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-drag]')) e.preventDefault(); });

/* ---------- iPhone-style swipes ---------- */
function goWeek(d) {
  const cur = curWeek().n, from = ui.sel || cur;
  const to = d === 0 ? cur : Math.max(1, Math.min(SEM.weeks, from + d));
  if (to === from && d !== 0) return;
  slideDir = d === 0 ? (to > from ? 1 : -1) : d; ui.sel = to === cur ? null : to; save(); render();
}
let sw = null, ps = null;
const closeSwipes = keep => document.querySelectorAll('.swipe.open-r').forEach(x => { if (x !== keep) { x.classList.remove('open-r'); x.querySelector('.tile').style.transform = ''; } });
document.addEventListener('pointerdown', e => {
  if (e.button !== 0 || dlg.open) return;
  if (e.target.closest('.sw-r')) return;
  const box = e.target.closest('.swipe');
  if (box) { closeSwipes(box); sw = { box, t: box.querySelector('.tile'), x: e.clientX, y: e.clientY, base: box.classList.contains('open-r') ? -164 : 0, on: false, off: 0 }; return; }
  closeSwipes(null);
  if (e.target.closest('.cpick,.segc,.picker,.tabbar,input,select,textarea,.pbar,a')) return;
  ps = { x: e.clientX, y: e.clientY, t: Date.now() };
});
document.addEventListener('pointermove', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.on) { if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) { sw.on = true; sw.box.classList.add('swiping'); } else if (Math.abs(dy) > 10) { sw = null; return; } else return; }
  sw.off = Math.max(-190, Math.min(150, sw.base + dx));
  sw.t.style.transform = `translateX(${sw.off}px)`;
  sw.box.classList.toggle('show-l', sw.off > 0); sw.box.classList.toggle('show-r', sw.off < 0);
  sw.box.classList.toggle('commit', sw.off > 90);
});
document.addEventListener('pointerup', e => {
  if (sw) {
    const s = sw; sw = null; s.box.classList.remove('swiping');
    if (s.on) {
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
      if (s.off > 90) { const it = byId(s.box.dataset.id); s.t.style.transform = ''; if (it) { const before = it.status; it.status = it.status === 'done' ? 'todo' : 'done'; save(); render(); toast(it.status === 'done' ? `${it.title} done` : `${it.title} back to to-do`, () => { it.status = before; save(); render(); }); } }
      else if (s.off < -60) { s.box.classList.add('open-r'); s.t.style.transform = 'translateX(-164px)'; }
      else { s.box.classList.remove('open-r', 'show-l', 'show-r'); s.t.style.transform = ''; }
    }
    return;
  }
  if (!ps) return;
  const dx = e.clientX - ps.x, dy = e.clientY - ps.y, fast = Date.now() - ps.t < 700, sx = ps.x; ps = null;
  if (!fast || Math.abs(dx) < 70 || Math.abs(dy) > 60) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  if (ui.tab === 'courses' && ui.course && dx > 0 && sx < 60) { ui.course = null; save(); render(); return; }
  if (ui.tab === 'week') goWeek(dx < 0 ? 1 : -1);
});
document.addEventListener('pointercancel', () => { if (sw) { sw.t.style.transform = ''; sw.box.classList.remove('swiping', 'open-r'); sw = null; } ps = null; });

/* ---------- actions ---------- */
const A = {
  tab: el => { ui.tab = el.dataset.tab; save(); render(); window.scrollTo(0, 0); },
  mode: el => { ui.mode = el.dataset.v; save(); render(); },
  wc: el => { ui.wc = el.dataset.id; save(); render(); },
  cview: el => { ui.cview = el.dataset.v; save(); render(); },
  'pick-course-week': el => { ui.tab = 'week'; ui.mode = 'course'; ui.wc = el.dataset.c; ui.sel = +el.dataset.w; save(); render(); window.scrollTo(0, 0); },
  stat: el => { if (el.dataset.k === 'carry') { ui.carryAll = true; render(); const c = document.getElementById('carry'); if (c) c.scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' }); } },
  carry: () => { ui.carryAll = !ui.carryAll; render(); },
  week: el => goWeek(+el.dataset.d),
  pick: el => { ui.sel = +el.dataset.w; ui.tab = 'week'; save(); render(); window.scrollTo(0, 0); },
  density: el => { ui.density = el.dataset.v; save(); render(); },
  course: el => { if (el.dataset.go) ui.tab = 'courses'; ui.course = el.dataset.id || null; ui.showFin = false; ui.allLater = false; save(); render(); window.scrollTo(0, 0); },
  'all-later': () => { ui.allLater = !ui.allLater; render(); },
  'toggle-fin': () => { ui.showFin = !ui.showFin; render(); },
  open: el => detail(el.dataset.id),
  tick: el => { const it = byId(el.dataset.id); if (!it) return; const before = it.status; it.status = it.status === 'todo' ? 'done' : 'todo'; save(); render(); if (it.status === 'done') toast(`${it.title} done`, () => { it.status = before; save(); render(); }); },
  status: el => { const it = byId(el.dataset.id); if (!it) return; it.status = el.dataset.v; save(); render(); detail(it.id); },
  edit: el => editor(byId(el.dataset.id), false),
  del: el => { if (!el.dataset.armed) { el.dataset.armed = 1; el.textContent = 'Tap again to delete'; return; } const it = byId(el.dataset.id), i = data.items.indexOf(it); data.items.splice(i, 1); save(); close(); render(); toast('Deleted', () => { data.items.splice(i, 0, it); save(); render(); }); },
  close: () => close(),
  signin: async () => { authErr = authMsg = ''; const email = ($('a-email') || {}).value || '', password = ($('a-pass') || {}).value || ''; if (!email || !password) { authErr = 'Enter your email and password.'; render(); return; } const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password }); if (error) { authErr = /confirm/i.test(error.message) ? 'Confirm your email first: open the link Supabase sent you, then sign in.' : 'That email and password don’t match. Try again or create an account.'; render(); } },
  signup: async () => { authErr = authMsg = ''; const email = ($('a-email') || {}).value || '', password = ($('a-pass') || {}).value || ''; if (!email || password.length < 8) { authErr = 'Enter your email and a password of at least 8 characters.'; render(); return; } const { data: res, error } = await sb.auth.signUp({ email: email.trim(), password, options: { emailRedirectTo: location.origin + location.pathname } }); if (error) { authErr = error.message; } else if (!res.session) { authMsg = 'Account created. Check your email for a confirmation link, then come back and sign in.'; } render(); },
  signout: async () => { await sb.auth.signOut(); try { localStorage.removeItem(CACHE); } catch {} },
  'sync-now': async () => { await push(); await pull(); toast('Synced'); },
  undo: () => { const f = undoFn; undoFn = null; $('toast').hidden = true; if (f) f(); },
  reset: el => { if (!el.dataset.armed) { el.dataset.armed = 1; el.querySelector('.grow').textContent = 'Tap again to reset everything'; return; } data = sample(); ui.sel = null; save(); render(); toast('Sample data restored'); },
};
document.addEventListener('click', e => {
  if (suppressClick) { e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const f = A[el.dataset.action]; if (f) { e.preventDefault(); f(el); }
}, true);
render();
initAuth();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
