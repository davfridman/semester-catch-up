<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semester Catch-Up</title>
<meta name="description" content="Your semester at a glance. The web version of the Semester Catch-Up iPhone app, on the same data.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
/* Same design as the iPhone app (see DESIGN.md in semester-ios): neutral cards, hues only for courses,
   status as a glyph and a word with a faint tint, one time cue per card. */
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --tray: #E3E5EC; --fill: rgba(118,118,128,.12); --fill2: rgba(118,118,128,.2);
  --label: #000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3); --sep: rgba(60,60,67,.18);
  --accent: #007AFF; --green: #34C759; --mint: #00C7BE; --red: #FF3B30; --orange: #FF9500;
  --done: rgba(52,199,89,.09); --reviewed: rgba(0,199,190,.11); --missed: rgba(255,59,48,.08);
  --c-blue: #007AFF; --c-purple: #AF52DE; --c-pink: #FF2D55; --c-teal: #30B0C7; --c-indigo: #5856D6;
  --c-orange: #FF9500; --c-cyan: #32ADE6; --c-brown: #A2845E;
  --bar: rgba(249,249,249,.82); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.06);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000; --card: #1C1C1E; --tray: #131316; --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.32);
    --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3); --sep: rgba(84,84,88,.6);
    --accent: #0A84FF; --green: #30D158; --mint: #63E6E2; --red: #FF453A; --orange: #FF9F0A;
    --c-blue: #0A84FF; --c-purple: #BF5AF2; --c-pink: #FF375F; --c-teal: #40C8E0; --c-indigo: #5E5CE6;
    --c-orange: #FF9F0A; --c-cyan: #64D2FF; --c-brown: #AC8E68; --bar: rgba(30,30,30,.8); --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #000; --card: #1C1C1E; --tray: #131316; --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.32);
  --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3); --sep: rgba(84,84,88,.6);
  --accent: #0A84FF; --green: #30D158; --mint: #63E6E2; --red: #FF453A; --orange: #FF9F0A;
  --c-blue: #0A84FF; --c-purple: #BF5AF2; --c-pink: #FF375F; --c-teal: #40C8E0; --c-indigo: #5E5CE6;
  --c-orange: #FF9F0A; --c-cyan: #64D2FF; --c-brown: #AC8E68; --bar: rgba(30,30,30,.8); --shadow: none;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--label); }
body { font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
main { max-width: 720px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(110px + env(safe-area-inset-bottom)); }
.hidden { display: none !important; }

/* Headers */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 8px 4px 14px; }
.head .sub { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: .02em; }
.head h1 { font-size: 34px; line-height: 1.1; margin: 2px 0 0; font-weight: 700; letter-spacing: -.01em; }
.head h2 { font-size: 28px; margin: 2px 0 0; font-weight: 700; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: 17px; margin: 4px 0 6px; }
.round { width: 40px; height: 40px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 20px; color: var(--label); }

/* Groups and rows (inset grouped lists) */
.group { background: var(--card); border-radius: 22px; overflow: hidden; margin: 0 0 18px; box-shadow: var(--shadow); }
.group-title { font-size: 15px; color: var(--label2); margin: 0 18px 8px; }
.group-foot { font-size: 13px; color: var(--label2); margin: -10px 18px 18px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 48px; width: 100%; text-align: left; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; border-top: .5px solid var(--sep); }
.row .grow { flex: 1; min-width: 0; }
.row .val { color: var(--label2); }
.row .chev::after { content: "›"; color: var(--label3); font-size: 22px; line-height: 1; }
.row .ico { width: 24px; text-align: center; color: var(--accent); }
.pad { padding: 14px 16px; }

/* Cards */
.tray { background: var(--tray); border-radius: 24px; padding: 10px; margin-bottom: 18px; }
.seg { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; margin-bottom: 8px; }
.seg button { flex: 1; font-size: 13px; font-weight: 500; padding: 7px 4px; border-radius: 8px; }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.cards { display: grid; gap: 8px; }
.card { background: var(--card); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; text-align: left; width: 100%; }
.card.done { background: linear-gradient(var(--done), var(--done)), var(--card); }
.card.reviewed { background: linear-gradient(var(--reviewed), var(--reviewed)), var(--card); }
.card.missed { background: linear-gradient(var(--missed), var(--missed)), var(--card); }
.circle { flex: none; width: 26px; height: 26px; margin-top: 1px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.circle.filled { background: currentColor; }
.circle.filled span { color: var(--card); }
.circle.locked { border-style: dashed; opacity: .6; }
.cbody { flex: 1; min-width: 0; }
.l1 { display: flex; gap: 10px; align-items: baseline; }
.title { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.title.dim { color: var(--label2); }
.cue { flex: none; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--label2); white-space: nowrap; }
.cue.strong { color: var(--label); font-weight: 600; }
.l2 { display: flex; gap: 6px; align-items: center; margin-top: 3px; font-size: 15px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--fill); color: var(--label2); flex: none; }
.tag.strong { background: var(--label); color: var(--card); }
.bar { height: 4px; border-radius: 2px; background: var(--fill2); margin-top: 7px; overflow: hidden; }
.bar > i { display: block; height: 100%; }
.empty { color: var(--label2); padding: 14px 8px; font-size: 15px; }

/* Rings */
.rings-top { display: flex; align-items: baseline; gap: 6px; }
.rings-top b { font-size: 24px; }
.rings { display: grid; gap: 14px 8px; margin-top: 14px; }
.ring-item { display: grid; justify-items: center; gap: 4px; font-size: 12px; }
.ring-item .name { font-weight: 600; }
.ring-item .meta { color: var(--label2); font-size: 11px; }

/* For you */
.feed-head { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 4px 10px; }
.feed-head h3 { margin: 0; font-size: 20px; }
.fcard { background: var(--card); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); cursor: pointer; margin-bottom: 18px; position: relative; }
.fcard .lab { font-size: 15px; font-weight: 600; color: var(--label2); display: flex; gap: 8px; align-items: center; }
.fcard .txt { margin: 8px 0 0; font-weight: 500; }
.fcard .det { margin: 6px 0 0; font-size: 15px; color: var(--label2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.fcard .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; font-weight: 600; }
.pill { padding: 6px 14px; border-radius: 99px; background: var(--fill); font-size: 15px; font-weight: 600; }
.pill.primary { background: var(--accent); color: #fff; }
.pill.wide { flex: 1; text-align: center; padding: 12px; font-size: 17px; }
.stack-shadow { position: absolute; left: 14px; right: 14px; bottom: -8px; height: 20px; background: var(--card); border-radius: 0 0 20px 20px; opacity: .55; z-index: -1; }
.qbanner { display: flex; gap: 12px; align-items: center; }
.qbanner .spark { width: 36px; height: 36px; border-radius: 50%; background: rgba(175,82,222,.14); display: grid; place-items: center; color: var(--c-purple); }

/* Tab bar */
nav.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 2px; padding: 5px; border-radius: 99px;
  background: var(--bar); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); box-shadow: 0 4px 24px rgba(0,0,0,.14); z-index: 20; width: min(420px, calc(100% - 32px)); }
nav.tabs button { flex: 1; display: grid; justify-items: center; gap: 1px; padding: 6px 4px; border-radius: 99px; font-size: 10px; font-weight: 600; color: var(--label); }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--accent); background: var(--fill); }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 26px 26px 0 0; padding: 10px 16px calc(24px + env(safe-area-inset-bottom)); animation: up .25s cubic-bezier(.2,.9,.3,1); }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 26px; max-height: 86vh; } }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--fill2); margin: 0 auto 8px; }
.sheet .bar-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.actions { display: flex; gap: 8px; margin-top: 12px; }
.chips { display: flex; gap: 8px; }
.chips button { flex: 1; padding: 10px 4px; border-radius: 12px; background: var(--fill); font-size: 14px; white-space: nowrap; }
.chips button.on { background: var(--accent); color: #fff; font-weight: 600; }
textarea, input[type=text], input[type=email], input[type=password] { width: 100%; font: inherit; color: inherit; background: transparent; border: 0; outline: none; resize: vertical; }
input[type=range] { width: 100%; accent-color: var(--accent); }
select { font: inherit; color: var(--label2); background: transparent; border: 0; text-align: right; }
.menu { display: grid; gap: 6px; margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--bar); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding: 12px 18px; border-radius: 99px; box-shadow: 0 4px 24px rgba(0,0,0,.18); font-size: 15px; z-index: 40; display: flex; gap: 14px; animation: up .2s; max-width: calc(100% - 32px); }
.toast button { color: var(--accent); font-weight: 600; }
.metrics { display: flex; gap: 16px; align-items: center; }
.metric b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.metric span { font-size: 12px; color: var(--label2); }
.week-row { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 10px 14px; }
.week-row .wk { width: 64px; font-size: 15px; font-weight: 600; }
.week-row .wk small { display: block; font-weight: 400; font-size: 12px; color: var(--label2); }
.glyphs { flex: 1; display: flex; gap: 6px; flex-wrap: wrap; }
.glyph { width: 20px; height: 20px; border: 2px solid currentColor; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.glyph.task { border-radius: 5px; }
.glyph.filled { background: currentColor; }
.glyph.filled span { color: var(--card); }
.post { white-space: pre-wrap; font-size: 15px; }
.summary { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(175,82,222,.1); font-size: 15px; }
.day-strip { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px 10px; padding-bottom: 2px; }
.day-strip::-webkit-scrollbar { display: none; }
.day { flex: none; width: 48px; display: grid; justify-items: center; gap: 3px; padding: 4px 0; font-size: 11px; color: var(--label2); }
.day b { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 500; color: var(--label); }
.day.today b { color: var(--accent); font-weight: 700; }
.day.on b { background: var(--accent); color: #fff; font-weight: 700; }
.dot { width: 5px; height: 5px; border-radius: 50%; }
.auth { max-width: 380px; margin: 12vh auto 0; text-align: center; }
.auth .group { text-align: left; }
.err { color: var(--red); font-size: 15px; margin: 8px 4px; }
.sec { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; margin: 14px 8px 6px; }
/* Motion only moves things; nothing starts invisible, so a paused tab never hides a sheet. */
@keyframes up { from { transform: translateY(24px); } }
@keyframes fade { from { background: rgba(0,0,0,0); } }
@media (prefers-reduced-motion: reduce) { .scrim, .sheet, .toast { animation: none; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs hidden" id="tabs" aria-label="Sections"></nav>
<div id="layer"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
