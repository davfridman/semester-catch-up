<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Semester Catch-Up</title>
<meta name="description" content="Your HUJI semester: what's due, what's on each day, and what to watch.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semester">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* "Timeline, dark" (design direction C). Dark only, by design.
   Layout: no page titles; a floating pill tab bar at the bottom; content in one phone-width column (centered on a Mac).
   Color means status only: each item is a pill with a border and fill in its status color and an icon disc in the same color. */
:root{
  color-scheme:dark;
  --bg:#0D0D0F; --surf:#1B1B1F; --surf2:#26262B; --text:#F3F3F5; --sec:#A0A0AA; --sep:#2E2E33; --bar:rgba(18,18,21,.94);
  --rail:#34343A; --inv:#F3F3F5; --invt:#0D0D0F; --sheet:#1B1B1F; --dim:rgba(0,0,0,.6);
  --g1:#E8E8EC; --g2:#8E8E96; --g3:#3E3E45;
  --todo-b:#4C8DFF; --todo-f:#13223D; --todo-t:#A4C6FF;
  --due-b:#F39A3D;  --due-f:#35220E;  --due-t:#FFC88E;
  --open-b:#9C8EFF; --open-f:#221E42; --open-t:#CBC3FF;
  --done-b:#4CBB6E; --done-f:#102E1A; --done-t:#98DEAC;
  --wont-b:#5C5C63; --wont-f:#18181B; --wont-t:#A3A3AA;
  --closed-b:#8B8E97; --closed-f:#28292D; --closed-t:#C9CBD1;
  --font:'Figtree',-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --navh:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--inv);outline-offset:2px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.st-todo{border:1.5px solid var(--todo-b);background:var(--todo-f)}.st-todo .sx{color:var(--todo-t)}.st-todo .ic{background:var(--todo-b)}
.st-due{border:1.5px solid var(--due-b);background:var(--due-f)}.st-due .sx{color:var(--due-t)}.st-due .ic{background:var(--due-b)}
.st-open{border:1.5px solid var(--open-b);background:var(--open-f)}.st-open .sx{color:var(--open-t)}.st-open .ic{background:var(--open-b)}
.st-done{border:1.5px solid var(--done-b);background:var(--done-f)}.st-done .sx{color:var(--done-t)}.st-done .ic{background:var(--done-b)}
.st-wont{border:1.5px dashed var(--wont-b);background:var(--wont-f)}.st-wont .sx{color:var(--wont-t)}.st-wont .ic{background:var(--wont-b)}
.st-closed{border:1.5px solid var(--closed-b);background:var(--closed-f)}.st-closed .sx{color:var(--closed-t)}.st-closed .ic{background:var(--closed-b)}
.bg-todo{background:var(--todo-b)}.bg-due{background:var(--due-b)}.bg-open{background:var(--open-b)}.bg-done{background:var(--done-b)}.bg-wont{background:var(--wont-b)}.bg-closed{background:var(--closed-b)}

.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(var(--navh) + 40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
body.hasstats .app{padding-bottom:calc(var(--navh) + 120px + env(safe-area-inset-bottom,0px))}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sech h2{margin:0;font-size:18px;font-weight:700}
.sech span,.sech button.lnk{font-size:13px;color:var(--sec);font-weight:600}
button.lnk{appearance:none;border:0;background:none;padding:0;cursor:pointer}
.round{appearance:none;width:40px;height:40px;border-radius:20px;border:1px solid var(--sep);background:var(--surf);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
.round:disabled{opacity:.35;cursor:default}
.empty{color:var(--sec);font-size:14px;margin:0;padding:14px 16px;background:var(--surf);border-radius:20px}
.foot{color:var(--sec);font-size:12px;margin:0 4px;line-height:1.5}

/* item pills */
.pill{position:relative;display:flex;align-items:center;gap:12px;border-radius:20px;padding:0 14px 0 10px;min-height:60px;width:100%;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y;appearance:none;text-align:left;color:var(--text)}
.pill.sm{min-height:48px;border-radius:24px;padding:0 14px 0 6px;gap:10px}
.ic{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;color:#fff;flex:none}
.sm .ic{width:34px;height:34px;border-radius:17px}
.ic svg{width:18px;height:18px}.sm .ic svg{width:16px;height:16px}
.pt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pt b{font-size:16px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.sm .pt b{font-size:14px}
.pt small{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sec);flex-wrap:wrap}
.cs{font-weight:700;font-size:11px;color:var(--sec);letter-spacing:.02em;white-space:nowrap}
.pr{display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
.pr .d{font-size:16px;font-weight:800;white-space:nowrap}
.sm .pr .d{font-size:13px;font-weight:700}
.pr small{font-size:12px;color:var(--sec);white-space:nowrap}
.st-done .pt b{color:var(--sec)}
.st-wont .pt b{color:var(--wont-t);text-decoration:line-through}
.list{display:flex;flex-direction:column;gap:8px}

/* swipe */
.swipe{position:relative;border-radius:20px;overflow:hidden}
.swipe.sm{border-radius:24px}
.swipe>.pill{transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:1}
.swipe.swiping>.pill{transition:none}
.sw-l,.sw-r{position:absolute;inset:0;display:flex;align-items:center;visibility:hidden}
.sw-l{background:var(--done-b);color:#08210f;padding-left:20px;gap:8px;font-weight:800;font-size:14px}
.sw-r{justify-content:flex-end;background:var(--surf)}
.sw-r button{appearance:none;border:0;height:100%;width:82px;font-weight:700;font-size:13px;cursor:pointer}
.sw-r button:first-child{background:var(--wont-b);color:#fff}
.sw-r button:last-child{background:var(--surf2);color:var(--text)}
.swipe.show-l .sw-l,.swipe.show-r .sw-r,.swipe.open-r .sw-r{visibility:visible}

/* catch-up cards */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-right:16px;scrollbar-width:none;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.cu{flex:0 0 152px;scroll-snap-align:start;padding:12px;border-radius:20px;background:var(--surf);display:flex;flex-direction:column;gap:8px;appearance:none;border:0;text-align:left;cursor:pointer;color:var(--text)}
.cu .h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sec)}
.cu .h b{font-size:11px;font-weight:700}
.cu .dots{display:flex;gap:6px;flex-wrap:wrap}
.cu .dot{width:32px;height:32px;border-radius:16px;display:grid;place-items:center}
.cu .dot svg{width:15px;height:15px}
.cu .more{font-size:11px;color:var(--sec);align-self:center}
.cu .n{font-size:12px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* week */
.wkh{display:flex;justify-content:space-between;align-items:center}
.wkh .c{display:flex;flex-direction:column;align-items:center;gap:1px}
.wkh .c b{font-size:17px;font-weight:800}
.wkh .c span{font-size:12px;font-weight:600;color:var(--sec)}
.wkh .c button{appearance:none;border:0;background:none;color:var(--todo-t);font-size:12px;font-weight:700;padding:0;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 0;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chips button{appearance:none;flex:1 0 auto;min-width:54px;height:34px;border-radius:17px;border:1px solid var(--sep);background:transparent;color:var(--sec);font-size:12px;font-weight:700;padding:0 12px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--inv);border-color:var(--inv);color:var(--invt)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.strip button{appearance:none;height:62px;border-radius:18px;border:0;background:var(--surf);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
.strip button[aria-current="date"]{background:var(--inv);color:var(--invt)}
.strip .w{font-size:11px;font-weight:600;opacity:.8}
.strip .n{font-size:17px;font-weight:800}
.strip .dd{display:flex;gap:2px;height:5px}
.strip .dd i{width:5px;height:5px;border-radius:3px}
.day{display:flex;flex-direction:column;gap:6px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 12px)}
.day h3{margin:0;font-size:14px;font-weight:800;color:var(--sec);padding-left:52px}
.day.today h3{color:var(--text)}
.tl{position:relative;display:flex;flex-direction:column;gap:6px}
.tl::before{content:"";position:absolute;left:44px;top:4px;bottom:4px;width:2px;border-radius:1px;background:var(--rail)}
.tlr{display:flex;align-items:center;gap:14px}
.tlr .tm{width:36px;text-align:right;font-size:12px;font-weight:700;color:var(--sec);font-variant-numeric:tabular-nums;flex:none}
.tlr .swipe{flex:1;min-width:0}
.statsbar{position:fixed;left:50%;transform:translateX(-50%);width:min(536px,calc(100% - 24px));bottom:calc(var(--navh) + 30px + env(safe-area-inset-bottom,0px));z-index:7;border-radius:20px;background:var(--surf);border:1px solid var(--sep);padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.statsbar .seg{display:flex;gap:3px;height:8px}
.statsbar .seg div{border-radius:4px}
.statsbar .lab{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.statsbar .lab span{font-size:11px;color:var(--sec);white-space:nowrap}
.statsbar .lab b{color:var(--text);font-size:13px;font-weight:800}

/* courses */
.chead{display:flex;align-items:center;gap:12px}
.chead .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.chead .t b{font-size:18px;font-weight:800;overflow-wrap:anywhere}
.chead .t span{font-size:12px;font-weight:600;color:var(--sec)}
.acts{display:flex;gap:8px}
.acts a,.acts button{appearance:none;flex:1;height:38px;border-radius:19px;background:var(--surf);border:1px solid var(--sep);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text)}
.acts svg{width:14px;height:14px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{background:var(--surf);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .l{font-size:12px;color:var(--sec);font-weight:600}
.card .v{font-size:26px;font-weight:800;line-height:1.1}
.card .s{font-size:11px;color:var(--sec);overflow-wrap:anywhere}
.card.g{flex-direction:row;align-items:center;gap:8px}
.card.g .gl{display:flex;flex-direction:column;font-size:11px;line-height:1.45;color:var(--sec);min-width:0}
.card.g .gl b{color:var(--text)}
.wrow{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:20px}
.wrow.now{background:var(--surf)}
.wrow.past{opacity:.75}
.wrow .wl{appearance:none;border:0;background:none;color:var(--text);width:44px;display:flex;flex-direction:column;padding:0;text-align:left;cursor:pointer;flex:none}
.wrow .wl b{font-size:14px;font-weight:800}
.wrow .wl span{font-size:11px;color:var(--sec);font-weight:600}
.blocks{flex:1;display:flex;gap:5px;min-width:0}
.blk{appearance:none;flex:1;min-width:0;height:54px;border-radius:14px;padding:0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.blk svg{width:17px;height:17px}
.blk span{max-width:100%;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blocks .none{font-size:12px;color:var(--sec);align-self:center}
.crow{appearance:none;width:100%;border:0;background:var(--surf);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;color:var(--text)}
.crow .badge{width:46px;height:46px;border-radius:23px;background:var(--surf2);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--text);flex:none;letter-spacing:.02em}
.crow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.crow .t b{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.crow .mini{display:flex;gap:3px}
.crow .mini i{width:16px;height:6px;border-radius:3px}
.crow .r{font-size:12px;color:var(--sec);text-align:right;white-space:nowrap}
.crow .r b{display:block;font-size:15px;color:var(--text);font-weight:800}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);width:min(536px,calc(100% - 24px));bottom:calc(16px + env(safe-area-inset-bottom,0px));height:var(--navh);border-radius:31px;background:var(--bar);border:1px solid var(--sep);display:flex;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:8;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav button{appearance:none;border:0;background:none;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sec);font-size:10px;font-weight:600;cursor:pointer;height:100%;justify-content:center;position:relative}
.nav button svg{width:24px;height:24px;stroke-width:1.7}
.nav button[aria-current="page"]{color:var(--text);font-weight:700}
.nav button[aria-current="page"] svg{stroke-width:2.2}
.nav .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--due-b);color:#2a1600;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* sheet */
dialog{border:0;padding:0;background:var(--sheet);color:var(--text);width:min(560px,100%);max-height:92%;margin:auto auto 0;border-radius:32px 32px 0 0;overflow:auto}
@media (min-width:700px){dialog{margin:auto;border-radius:32px;max-height:88%}}
dialog::backdrop{background:var(--dim)}
.sheet{padding:6px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sec);opacity:.45;align-self:center;margin-top:4px}
.shead{border-radius:24px;padding:14px;display:flex;align-items:center;gap:12px}
.shead .ic{width:48px;height:48px;border-radius:24px}.shead .ic svg{width:22px;height:22px}
.shead h2{margin:0;font-size:22px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.shead .sub{font-size:13px;color:var(--sec)}
.shead .pr .d{font-size:18px}
.stbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stbtns button{appearance:none;height:44px;border-radius:22px;border:1px solid var(--sep);background:var(--surf2);color:var(--text);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.stbtns button i{width:8px;height:8px;border-radius:4px}
.stbtns button[aria-pressed="true"]{border-width:2px;font-weight:800}
.stnow{font-size:12px;color:var(--sec);margin:-6px 4px 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.info{background:var(--surf2);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.info .l{font-size:12px;color:var(--sec);font-weight:600}
.info .v{font-size:16px;font-weight:800;overflow-wrap:anywhere}
.info .s{font-size:12px;color:var(--sec)}
.info.note .v{font-size:15px;font-weight:400;line-height:1.45;white-space:pre-wrap}
.info.note a{text-decoration:underline;color:var(--todo-t)}
.bigbtn{appearance:none;height:52px;border-radius:26px;background:var(--inv);color:var(--invt);border:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;cursor:pointer;width:100%}
.bigbtn.ghost{background:var(--surf2);color:var(--text)}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surf2);border-radius:20px;min-height:52px;appearance:none;border:0;width:100%;text-align:left;cursor:pointer;color:var(--text);font-size:15px}
.setrow .grow{flex:1;min-width:0}
.setrow small{display:block;color:var(--sec);font-size:12px;margin-top:2px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--done-b);margin-right:6px;vertical-align:1px}
.syncdot.saving{background:var(--open-b)}.syncdot.offline{background:var(--due-b)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.legend span{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 10px;border-radius:14px}

/* sign in */
.auth{display:flex;flex-direction:column;gap:14px;padding-top:30px}
.auth img{width:72px;height:72px;border-radius:18px}
.auth h1{margin:0;font-size:30px;font-weight:800}
.auth p{margin:0;color:var(--sec)}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:12px;font-weight:600;color:var(--sec)}
.field input{height:50px;border-radius:16px;border:1px solid var(--sep);background:var(--surf);padding:0 14px;font-size:16px;color:var(--text)}
.field input:focus{outline:none;border-color:var(--sec)}
.msg{font-size:14px;margin:0}.msg.err{color:var(--due-t)}.msg.ok{color:var(--done-t)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 30px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--inv);color:var(--invt);border-radius:16px;padding:10px 12px 10px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px)}
body.hasstats .toast{bottom:calc(var(--navh) + 106px + env(safe-area-inset-bottom,0px))}
.toast button{appearance:none;border:0;background:none;color:var(--invt);font-weight:800;cursor:pointer;text-decoration:underline;padding:2px 4px}
@media (prefers-reduced-motion:no-preference){.slide-r{animation:sr .26s cubic-bezier(.2,.8,.2,1)}.slide-l{animation:sl .26s cubic-bezier(.2,.8,.2,1)}@keyframes sr{from{transform:translateX(36px);opacity:.3}to{transform:none;opacity:1}}@keyframes sl{from{transform:translateX(-36px);opacity:.3}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<main class="app" id="app"><p class="foot" style="padding-top:40px">Loading…</p></main>
<div class="statsbar" id="stats" hidden></div>
<nav class="nav" id="nav" aria-label="Sections"></nav>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(() => {
'use strict';
/* ---------- constants ---------- */
const SEM = { start: '2026-10-11', weeks: 15 };
const WATCH = new Set(['Lecture', 'Tutorial', 'Online unit']);
const SHORT = { Lecture: 'L', Tutorial: 'T', 'Online unit': 'Unit ', Exercise: 'Ex ', Quiz: 'Quiz ', Lab: 'Lab ', Exam: 'Exam ', Project: 'Proj ', Reading: 'Read ' };
const P = {
  Lecture: 'M4 5h16v12H4zM10 8.5l4.5 2.5-4.5 2.5z',

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);

const save = () => { cacheLocal(); if (CLOUD && user) { clearTimeout(pushT); pushT = setTimeout(push, 450); } };

async function push() {
  if (!CLOUD || !user || pushing) return;

    for (const k of synced.keys()) if (!now.has(k)) dels.push(k);
    for (let i = 0; i < ups.length; i += 400) {
      const rows = ups.slice(i, i + 400).map(k => { const [col, id] = k.split('\u0000'); return { user_id: user.id, col, id, data: JSON.parse(now.get(k)), updated_at: new Date().toISOString() }; });
      const { error } = await sb.from('docs').upsert(rows, { onConflict: 'user_id,col,id' });

/* ---------- weeks ---------- */
let weeks = [];
function buildWeeks() {
  const p = (data && data.prefs) || {};

  if (/^\d{4}-\d{2}-\d{2}$/.test(p.semEnd || '')) SEM.weeks = Math.max(1, Math.ceil((diffDays(parse(p.semEnd), parse(SEM.start)) + 1) / 7));

/* ---------- status ---------- */

  if (it.status === 'skip') return { k: 'wont', t: 'Won’t do' };
  if (WATCH.has(it.type)) {
    if (it.date > today) return { k: 'open', t: 'Upcoming' };
    const a = diffDays(now, parse(it.date));
    return { k: a > 7 ? 'due' : 'todo', t: a === 0 ? 'Today' : a === 1 ? 'Yesterday' : `${a} days behind` };
  }
  if (it.opens && it.opens > today) return { k: 'open', t: `Opens ${dm(it.opens)}` };
  const n = diffDays(parse(it.date), now);
  if (n < 0 || (n === 0 && it.time && it.time < `${pad(now.getHours())}:${pad(now.getMinutes())}`)) return { k: 'closed', t: 'Closed' };
  if (n <= 3) return { k: 'due', t: n === 0 ? 'Due today' : n === 1 ? 'Due tomorrow' : `Due ${dow(it.date)}` };

function weekItems(w, f) {
  const ev = [];
  for (const it of data.items) {
    if (!f(it)) continue;
    if (it.date >= w.ws && it.date <= w.we) ev.push({ it, date: it.date, time: it.time || '', kind: WATCH.has(it.type) ? 'session' : 'due' });
    if (it.opens && it.opens >= w.ws && it.opens <= w.we && state(it).k === 'open') ev.push({ it, date: it.opens, time: it.opensTime || '', kind: 'opens' });

    return `<section class="day${ds === today ? ' today' : ''}" id="day-${ds}"><h3>${ds === today ? 'Today · ' : ''}${DOW[d.getDay()]} ${esc(dm(ds))}</h3><div class="tl">${es.map(e => {
      const t = e.kind === 'due' ? `${e.it.title} due` : e.kind === 'opens' ? `${e.it.title} opens` : e.it.title;
      return `<div class="tlr"><span class="tm">${esc(e.time || '—')}</span>${pill(e.it, { sm: true, opening: e.kind === 'opens', noswipe: e.kind === 'opens', title: t, sub: '', right: `<span class="cs">${esc(C(e.it.c).short)}</span>` })}</div>`; }).join('')}</div></section>`;
  }).join('');
  return `<div class="wkh" data-swipezone="1"><button type="button" class="round" data-action="week" data-d="-1" aria-label="Previous week" ${sel.n === 1 ? 'disabled' : ''}>${CHEV_L}</button>
    <span class="c"><b>${esc(range(sel.start, sel.end))}</b><span>Week ${sel.n}</span>${sel === cur ? '' : '<button type="button" data-action="week" data-d="0">Back to this week</button>'}</span>
    <button type="button" class="round" data-action="week" data-d="1" aria-label="Next week" ${sel.n === weeks.length ? 'disabled' : ''}>${CHEV_R}</button></div>
  <div class="chips" role="group" aria-label="Filter by course"><button type="button" data-action="wc" data-id="all" aria-pressed="${ui.wc === 'all'}">All</button>${data.courses.map(c => `<button type="button" data-action="wc" data-id="${esc(c.id)}" aria-pressed="${ui.wc === c.id}">${esc(c.short)}</button>`).join('')}</div>
  <div class="strip">${strip}</div>
  <div class="slidebox" style="display:flex;flex-direction:column;gap:14px">
  ${carry.length ? `<div class="sec"><div class="sech"><h2 style="font-size:15px">From earlier weeks</h2><button type="button" class="lnk" data-action="carry">${ui.carryAll || carry.length <= 3 ? `${carry.length}` : `Show all ${carry.length}`}</button></div><div class="list">${(ui.carryAll ? carry : carry.slice(0, 3)).map(it => pill(it, { sm: true, title: it.title, sub: '', right: `<span class="cs" style="margin-right:6px">${esc(C(it.c).short)}</span><span class="d sx">${esc(dm(it.date))}</span>` })).join('')}</div></div>` : ''}
  ${days || '<p class="empty">Nothing this week.</p>'}
  </div>`;
}

function viewCourses() {
  const cur = curWeek();
  return `<div class="sech"><h2>Courses</h2><button type="button" class="round" style="width:34px;height:34px" data-action="settings" aria-label="Settings">${GEAR}</button></div>
  <div class="list">${data.courses.map(c => {
    const its = data.items.filter(it => it.c === c.id), open = its.filter(openish).length, wk = its.filter(it => it.date >= cur.ws && it.date <= cur.we);
    return `<button type="button" class="crow" data-action="course" data-id="${esc(c.id)}"><span class="badge">${esc(c.short)}</span>
      <span class="t"><b dir="auto">${esc(c.name)}</b><span class="mini" aria-label="This week">${wk.map(it => `<i class="bg-${state(it).k}"></i>`).join('')}</span></span>
      <span class="r"><b>${open}</b>open</span></button>`; }).join('') || '<p class="empty">No courses yet.</p>'}</div>`;
}
function viewCourse(id) {
  const c = C(id), its = data.items.filter(it => it.c === id).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  const cur = curWeek(), today = iso(new Date());
  const open = its.filter(openish), coming = its.filter(it => state(it).k === 'open' && !WATCH.has(it.type));
  const nextDue = open.filter(it => !WATCH.has(it.type)).sort((a, b) => a.date.localeCompare(b.date))[0];
  const nextOpen = coming.filter(it => it.opens).sort((a, b) => a.opens.localeCompare(b.opens))[0];
  const g = (c.grading || []).filter(x => x.weight);
  let off = 0; const shades = ['var(--g1)', 'var(--g2)', '#62626A', '#4A4A52'];
  const donut = `<svg width="42" height="42" viewBox="0 0 44 44" aria-hidden="true" style="flex:none"><circle cx="22" cy="22" r="17" fill="none" style="stroke:var(--g3)" stroke-width="7"></circle>${g.map((x, i) => { const s = `<circle cx="22" cy="22" r="17" fill="none" style="stroke:${shades[i % 4]}" stroke-width="7" pathLength="100" stroke-dasharray="${x.weight} 100" stroke-dashoffset="${-off}" transform="rotate(-90 22 22)"></circle>`; off += x.weight; return s; }).join('')}</svg>`;
  const rows = weeks.map(w => {
    const ev = its.filter(it => it.date >= w.ws && it.date <= w.we);
    return `<div class="wrow${w === cur ? ' now' : w.we < today ? ' past' : ''}"><button type="button" class="wl" data-action="course-week" data-w="${w.n}" data-c="${esc(id)}" aria-label="Open week ${w.n} for ${esc(c.name)}"><b>W${w.n}</b><span>${esc(dm(w.ws))}</span></button>
      <div class="blocks">${ev.length ? ev.map(it => `<button type="button" class="blk st-${state(it).k}" data-action="open" data-id="${esc(it.id)}" title="${esc(it.title)} · ${esc(state(it).t)}"><span class="sx" style="display:grid">${icon(it.type)}</span><span class="sx" dir="auto">${esc(shortName(it))}</span></button>`).join('') : '<span class="none">No events</span>'}</div></div>`;
  }).join('');
  const rec = safeUrl(c.recordings), moo = safeUrl(c.moodle);
  return `<div class="chead" data-swipeback="1"><button type="button" class="round" data-action="course" data-id="" aria-label="Back to courses">${CHEV_L}</button>
    <span class="t"><b dir="auto">${esc(c.name)}</b><span>${esc(c.short)} · Week ${cur.n} of ${weeks.length}</span></span></div>
  <div class="acts">${moo ? `<a href="${esc(moo)}" target="_blank" rel="noopener">Moodle ↗</a>` : ''}${rec ? `<a href="${esc(rec)}" target="_blank" rel="noopener">${svg(P.Lecture)}Recordings</a>` : ''}<button type="button" data-action="notes" data-id="${esc(id)}">${svg('M6 3h12v18H6zM9 8h6M9 12h6M9 16h3')}Notes</button></div>
  <div class="cards3">
    <div class="card"><span class="l">Open</span><span class="v">${open.length}</span><span class="s">${nextDue ? `${esc(shortName(nextDue))} due ${esc(dm(nextDue.date))}` : 'Nothing due'}</span></div>
    <div class="card"><span class="l">Coming up</span><span class="v">${coming.length}</span><span class="s">${nextOpen ? `${esc(shortName(nextOpen))} opens ${esc(dm(nextOpen.opens))}` : '—'}</span></div>
    <div class="card g">${g.length ? donut + `<span class="gl">${g.slice(0, 3).map(x => `<span><b>${x.weight}</b> ${esc((x.label || x.kind).split(' ')[0].toLowerCase())}</span>`).join('')}</span>` : '<span class="gl">No grade<br>breakdown</span>'}</div>
  </div>
  <div class="sec"><div class="sech"><h2>Week by week</h2></div>${rows}</div>`;
}

/* ---------- sheets ---------- */
const dlg = $('dlg'), sheetEl = $('sheet');
const show = html => { sheetEl.innerHTML = '<div class="grab" aria-hidden="true"></div>' + html; if (!dlg.open) dlg.showModal ? dlg.showModal() : dlg.setAttribute('open', ''); };
const close = () => { if (dlg.open) dlg.close(); };
dlg.addEventListener('click', e => { if (e.target === dlg) close(); });
function detail(id) {
  const it = byId(id); if (!it) return;
  const s = state(it), c = C(it.c), link = safeUrl(it.link) || (WATCH.has(it.type) ? safeUrl(c.recordings) : '');
  const cur = it.status === 'done' ? 'done' : it.status === 'skip' ? 'wont' : 'todo';
  const btn = (v, k, l) => `<button type="button" class="${cur === k ? 'st-' + k : ''}" data-action="status" data-id="${esc(id)}" data-v="${v}" aria-pressed="${cur === k}">${cur === k ? `<span class="sx">${l}</span>` : `<i class="bg-${k}"></i>${l}`}</button>`;
  const when = (ds, tm) => `<span class="v">${esc(dm(ds))} · ${esc(dow(ds))}</span><span class="s">${esc(tm || '—')}</span>`;
  const notes = [it.topic && WATCH.has(it.type) ? it.topic : '', it.note].filter(Boolean).join('\n\n');
  show(`<div class="shead st-${s.k}"><span class="ic">${icon(it.type)}</span><span class="pt"><h2 dir="auto">${esc(it.title)}</h2><span class="sub"><b style="font-size:12px">${esc(c.short)}</b> · ${esc(it.type)}</span></span>
      <span class="pr"><span class="d sx">${esc(dm(it.date))}</span><small>${esc(dow(it.date))}${it.time ? ' · ' + esc(it.time) : ''}</small></span></div>
    <div class="stbtns">${btn('todo', 'todo', WATCH.has(it.type) ? 'To watch' : 'To do')}${btn('done', 'done', WATCH.has(it.type) ? 'Watched' : 'Done')}${btn('skip', 'wont', 'Won’t do')}</div>
    <p class="stnow">Now: <b class="st-${s.k}" style="border:0;background:none"><span class="sx">${esc(s.t)}</span></b></p>
    <div class="grid2">
      <div class="info"><span class="l">${WATCH.has(it.type) ? 'Held' : 'Due'}</span>${when(it.date, it.time)}</div>
      ${it.opens ? `<div class="info"><span class="l">${state(it).k === 'open' ? 'Opens' : 'Opened'}</span>${when(it.opens, it.opensTime)}</div>` : ''}
      ${it.weight ? `<div class="info"><span class="l">Weight</span><span class="v">${it.weight}%</span><span class="s">of final grade</span></div>` : ''}
      ${link ? `<a class="info" href="${esc(link)}" target="_blank" rel="noopener"><span class="l">Link</span><span class="v">${WATCH.has(it.type) ? 'Watch ↗' : 'Moodle ↗'}</span><span class="s">${WATCH.has(it.type) ? 'Recording' : 'Submission page'}</span></a>` : ''}
    </div>
    ${notes ? `<div class="info note"><span class="l">Notes</span><span class="v" dir="auto">${linkify(notes)}</span></div>` : ''}
    <button type="button" class="bigbtn" data-action="close">Close</button>`);
}
function courseNotes(id) {
  const c = C(id), g = (c.grading || []).filter(x => x.weight);
  show(`<div class="chead"><span class="t"><b dir="auto">${esc(c.name)}</b><span>${esc(c.short)} · ${esc(c.code || '')}</span></span></div>
    ${g.length ? `<div class="info"><span class="l">Grade</span><span class="v" style="font-weight:600;font-size:15px">${g.map(x => `${esc(x.label || x.kind)} ${x.weight}%`).join(' · ')}</span></div>` : ''}
    ${c.notes ? `<div class="info note"><span class="l">Important</span><span class="v" dir="auto">${linkify(c.notes)}</span></div>` : '<p class="empty">No notes for this course.</p>'}
    <button type="button" class="bigbtn" data-action="close">Close</button>`);
}
function settings() {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  show(`<div class="chead"><span class="t"><b>Settings</b><span>Semester Catch-Up</span></span></div>
    ${CLOUD ? `<div class="setrow" style="cursor:default"><span class="grow">${esc(user ? user.email : '')}<small id="syncline">${syncLabel()}</small></span></div>
    <button type="button" class="setrow" data-action="sync-now"><span class="grow">Sync now</span></button>` : ''}
    ${standalone ? '' : '<div class="setrow" style="cursor:default"><span class="grow">Install on your iPhone<small>In Safari, tap Share, then Add to Home Screen. It then opens full screen like any app.</small></span></div>'}
    <div class="legend">${STATES.map(([k, l]) => `<span class="st-${k}"><i class="bg-${k}" style="width:10px;height:10px;border-radius:5px;flex:none"></i><span class="sx">${l}</span></span>`).join('')}</div>
    <p class="foot">Color only ever means status. Courses are named, never colored. Data from Moodle syncs every morning.${data.prefs && data.prefs.lastSync ? ` Last sync: ${esc(dm(data.prefs.lastSync.slice(0, 10)))} ${esc(data.prefs.lastSync.slice(11, 16))}.` : ''}</p>
    ${CLOUD ? '<button type="button" class="bigbtn ghost" data-action="signout" style="color:var(--due-t)">Sign out</button>' : ''}
    <button type="button" class="bigbtn" data-action="close">Close</button>`);
}

/* ---------- toast with undo ---------- */
let toastT, undoFn = null;
function toast(msg, undo) {
  const t = $('toast'); undoFn = undo || null;
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" data-action="undo">Undo</button>' : ''}`;
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; undoFn = null; }, undo ? 5000 : 2400);
}
function setStatus(it, v) {
  const before = it.status; it.status = v; save(); render();
  if (dlg.open && sheetEl.querySelector('.shead')) detail(it.id);
  toast(v === 'done' ? `${it.title} ${WATCH.has(it.type) ? 'watched' : 'done'}` : v === 'skip' ? `${it.title}: won’t do` : `${it.title} back to to-do`, () => { it.status = before; save(); render(); if (dlg.open && sheetEl.querySelector('.shead')) detail(it.id); });
}

/* ---------- swipes ---------- */
let suppressClick = false;
function goWeek(d) {
  const cur = curWeek().n, from = ui.sel || cur;
  const to = d === 0 ? cur : Math.max(1, Math.min(weeks.length, from + d));
  if (to === from && d !== 0) return;
  slideDir = d === 0 ? (to > from ? 1 : -1) : d; ui.sel = to === cur ? null : to; save(); render(); window.scrollTo(0, 0);
}
let sw = null, ps = null;
const closeSwipes = keep => document.querySelectorAll('.swipe.open-r').forEach(x => { if (x !== keep) { x.classList.remove('open-r', 'show-r'); x.querySelector('.pill').style.transform = ''; } });
document.addEventListener('pointerdown', e => {
  if (e.button !== 0 || dlg.open) return;
  if (e.target.closest('.sw-r')) return;
  const box = e.target.closest('.swipe');
  if (box) { closeSwipes(box); sw = { box, t: box.querySelector('.pill'), x: e.clientX, y: e.clientY, base: box.classList.contains('open-r') ? -164 : 0, on: false, off: 0 }; return; }
  closeSwipes(null);
  if (e.target.closest('.chips,.strip,.hscroll,.nav,.statsbar,input,a,.blocks')) return;
  ps = { x: e.clientX, y: e.clientY, t: Date.now() };
});
document.addEventListener('pointermove', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.on) { if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) { sw.on = true; sw.box.classList.add('swiping'); } else if (Math.abs(dy) > 10) { sw = null; return; } else return; }
  sw.off = Math.max(-190, Math.min(150, sw.base + dx));
  sw.t.style.transform = `translateX(${sw.off}px)`;
  sw.box.classList.toggle('show-l', sw.off > 0); sw.box.classList.toggle('show-r', sw.off < 0);
});
document.addEventListener('pointerup', e => {
  if (sw) {
    const s = sw; sw = null; s.box.classList.remove('swiping');
    if (s.on) {
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
      if (s.off > 90) { const it = byId(s.box.dataset.id); s.t.style.transform = ''; if (it) setStatus(it, it.status === 'done' ? 'todo' : 'done'); }
      else if (s.off < -60) { s.box.classList.add('open-r'); s.t.style.transform = 'translateX(-164px)'; }
      else { s.box.classList.remove('open-r', 'show-l', 'show-r'); s.t.style.transform = ''; }
    }
    return;
  }
  if (!ps) return;
  const dx = e.clientX - ps.x, dy = e.clientY - ps.y, fast = Date.now() - ps.t < 700, sx = ps.x; ps = null;
  if (!fast || Math.abs(dx) < 70 || Math.abs(dy) > 60) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  if (ui.tab === 'courses' && ui.course && dx > 0 && sx < 60) { ui.course = null; save(); render(); return; }
  if (ui.tab === 'week') goWeek(dx < 0 ? 1 : -1);
});
document.addEventListener('pointercancel', () => { if (sw) { sw.t.style.transform = ''; sw.box.classList.remove('swiping', 'open-r', 'show-l', 'show-r'); sw = null; } ps = null; });

/* ---------- actions ---------- */
const A = {
  tab: el => { if (ui.tab === el.dataset.tab && el.dataset.tab === 'courses') ui.course = null; ui.tab = el.dataset.tab; save(); render(); window.scrollTo(0, 0); },
  open: el => detail(el.dataset.id),
  status: el => { const it = byId(el.dataset.id); if (it) { closeSwipes(null); setStatus(it, el.dataset.v); } },
  week: el => goWeek(+el.dataset.d),
  wc: el => { ui.wc = el.dataset.id; save(); render(); },
  'jump-day': el => { const s = document.getElementById('day-' + el.dataset.d); if (s) s.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); else toast('Nothing on that day.'); },
  carry: () => { ui.carryAll = !ui.carryAll; render(); },
  'all-tasks': () => { ui.allTasks = !ui.allTasks; render(); },
  course: el => { if (el.dataset.go) ui.tab = 'courses'; ui.course = el.dataset.id || null; save(); render(); window.scrollTo(0, 0); },
  'course-week': el => { ui.tab = 'week'; ui.wc = el.dataset.c; ui.sel = +el.dataset.w === curWeek().n ? null : +el.dataset.w; save(); render(); window.scrollTo(0, 0); },
  notes: el => courseNotes(el.dataset.id),
  settings: () => settings(),
  close: () => close(),
  undo: () => { const f = undoFn; undoFn = null; $('toast').hidden = true; if (f) f(); },
  signin: async () => { authErr = authMsg = ''; const email = ($('a-email') || {}).value || '', password = ($('a-pass') || {}).value || ''; if (!email || !password) { authErr = 'Enter your email and password.'; render(); return; } const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password }); if (error) { authErr = /confirm/i.test(error.message) ? 'Confirm your email first: open the link Supabase sent you, then sign in.' : 'That email and password don’t match. Try again or create an account.'; render(); } },
  signup: async () => { authErr = authMsg = ''; const email = ($('a-email') || {}).value || '', password = ($('a-pass') || {}).value || ''; if (!email || password.length < 8) { authErr = 'Enter your email and a password of at least 8 characters.'; render(); return; } const { data: res, error } = await sb.auth.signUp({ email: email.trim(), password, options: { emailRedirectTo: location.origin + location.pathname } }); if (error) { authErr = error.message; } else if (!res.session) { authMsg = 'Account created. Open the confirmation link in your email, then come back here and sign in.'; } render(); },
  signout: async () => { close(); await sb.auth.signOut(); try { localStorage.removeItem(CACHE); } catch {} },
  'sync-now': async () => { await push(); await pull(); toast('Synced'); },
};
document.addEventListener('click', e => {
  if (suppressClick) { e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const f = A[el.dataset.action]; if (f) { e.preventDefault(); f(el); }
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'a-pass' || e.target.id === 'a-email')) A.signin(); });
setInterval(() => { if (!dlg.open && document.visibilityState === 'visible') render(); }, 5 * 60 * 1000);

render();
initAuth();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
